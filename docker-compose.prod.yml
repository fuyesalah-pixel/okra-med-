version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    networks: [okra_internal]
    logging:
      driver: json-file
      options: { "max-size": "10m", "max-file": "3" }
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: okra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: okramed
    volumes: [okra_pgdata:/var/lib/postgresql/data]
    networks: [okra_internal]
    logging:
      driver: json-file
      options: { "max-size": "10m", "max-file": "3" }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [okra_redisdata:/data]
    networks: [okra_internal]
    logging:
      driver: json-file
      options: { "max-size": "10m", "max-file": "3" }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - okra_caddy_data:/data
      - okra_caddy_config:/config
    networks: [okra_internal]
    logging:
      driver: json-file
      options: { "max-size": "10m", "max-file": "3" }
volumes:
  okra_pgdata:
  okra_redisdata:
  okra_caddy_data:
  okra_caddy_config:
networks:
  okra_internal:
    driver: bridge
