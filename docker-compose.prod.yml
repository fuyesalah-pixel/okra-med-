services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    labels:
      - "traefik.enable=true"
      # Tell Traefik which of web's networks to use for load-balancing
      - "traefik.docker.network=okra-med-proxy"
      # Route all traffic for okra.mekatanker.shop to this service
      - "traefik.http.routers.okra-web.entrypoints=websecure"
      - "traefik.http.routers.okra-web.rule=Host(`okra.mekatanker.shop`)"
      - "traefik.http.routers.okra-web.tls=true"
      - "traefik.http.routers.okra-web.tls.certresolver=dns-letsencrypt"
      - "traefik.http.services.okra-web.loadbalancer.server.port=3000"
    networks:
      # Internal network: reaches postgres and redis
      - okra_internal
      # External network: Traefik discovers and load-balances via this
      - okra-med-proxy
    depends_on: [postgres, redis]
    logging:
      driver: json-file
      options: { "max-size": "10m", "max-file": "3" }
  # One-shot migration runner. Uses the builder stage because the production
  # `web` image is Next standalone output and has no pnpm, drizzle-kit or DB
  # sources. Never started by `up`; deploy.sh runs it explicitly before web.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    # DATABASE_URL is the RLS-constrained app role in production, and the
    # platform role is the same privileges plus BYPASSRLS — neither may run DDL.
    # Migrations therefore use MIGRATION_DATABASE_URL (owner), falling back to
    # DATABASE_URL only where those are the same role (CI).
    command:
      - sh
      - -c
      - 'DATABASE_URL="$${MIGRATION_DATABASE_URL:-$$DATABASE_URL}" pnpm --filter @okra-med/db db:migrate'
    env_file: .env.production
    depends_on: [postgres]
    networks: [okra_internal]
    restart: "no"
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: okra
      # POSTGRES_PASSWORD and POSTGRES_DB are supplied by env_file (.env.production).
      # Do not use ${VAR} interpolation here — that requires the var in the shell
      # environment at compose-up time. env_file passes it directly to the container.
      POSTGRES_DB: okramed
    volumes: [okra_pgdata:/var/lib/postgresql/data]
    networks: [okra_internal]
    logging:
      driver: json-file
      options: { "max-size": "10m", "max-file": "3" }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [okra_redisdata:/data]
    networks: [okra_internal]
    logging:
      driver: json-file
      options: { "max-size": "10m", "max-file": "3" }
  # caddy removed — Traefik handles TLS termination and reverse-proxying.
  # The web container is reachable via the okra-med-proxy external network.
volumes:
  okra_pgdata:
  okra_redisdata:
networks:
  okra_internal:
    driver: bridge
  okra-med-proxy:
    # This network must be created on the VPS before first deploy:
    #   docker network create okra-med-proxy
    # It is external so Traefik (on host network) can discover containers on it.
    external: true
